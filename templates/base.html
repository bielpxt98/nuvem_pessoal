<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo or 'NUVEM PESSOAL DE FOTOS E VÍDEOS' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="container">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}<div class="alerts">{% for cat,msg in mensagens %}<p class="alert {{ cat }}">{{ msg }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
