{% extends 'base.html' %}
{% block content %}
<section class="login-card">
  <div>
    <p class="eyebrow">Recuperação de acesso</p>
    <h1>RECUPERAR SENHA</h1>
    <p class="muted">Informe o código de recuperação e cadastre uma nova senha para o administrador.</p>
  </div>
  <form method="post" class="form">
    <label>Código de recuperação<input name="codigo_recuperacao" type="password" autocomplete="one-time-code" required autofocus></label>
    <label>Nova senha<input name="nova_senha" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirmar nova senha<input name="confirmar_nova_senha" type="password" autocomplete="new-password" minlength="8" required></label>
    <button type="submit">REDEFINIR SENHA</button>
    <a class="linkbtn secondary" href="{{ url_for('login') }}">VOLTAR PARA LOGIN</a>
  </form>
</section>
{% endblock %}
